<title>SteamPad — Checklist de Validación</title>
<style>
  :root{
    --bg:#eef1f0; --surface:#ffffff; --surface-2:#e4e8e6; --border:#cdd3d1;
    --text:#1a1d1f; --text-muted:#5b6462;
    --accent:#a8632a; --accent-soft:#f0dcc4;
    --ok:#2f7d63; --ok-bg:#e0f0ea;
    --warn:#a67a1e; --warn-bg:#fbf0da;
    --danger:#a8433a; --danger-bg:#f8e2df;
    --font-display:"Segoe UI Semibold","Segoe UI",system-ui,-apple-system,sans-serif;
    --font-body:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
    --font-mono:ui-monospace,"Cascadia Code","Consolas","SFMono-Regular",monospace;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#12161b; --surface:#1a2028; --surface-2:#212933; --border:#313b46;
      --text:#e8e6e1; --text-muted:#9aa3ab;
      --accent:#d3903f; --accent-soft:#3a2c1a;
      --ok:#4fb08b; --ok-bg:#16302a;
      --warn:#d1a13a; --warn-bg:#332a15;
      --danger:#d1695d; --danger-bg:#33201d;
    }
  }
  :root[data-theme="dark"]{
    --bg:#12161b; --surface:#1a2028; --surface-2:#212933; --border:#313b46;
    --text:#e8e6e1; --text-muted:#9aa3ab;
    --accent:#d3903f; --accent-soft:#3a2c1a;
    --ok:#4fb08b; --ok-bg:#16302a;
    --warn:#d1a13a; --warn-bg:#332a15;
    --danger:#d1695d; --danger-bg:#33201d;
  }
  :root[data-theme="light"]{
    --bg:#eef1f0; --surface:#ffffff; --surface-2:#e4e8e6; --border:#cdd3d1;
    --text:#1a1d1f; --text-muted:#5b6462;
    --accent:#a8632a; --accent-soft:#f0dcc4;
    --ok:#2f7d63; --ok-bg:#e0f0ea;
    --warn:#a67a1e; --warn-bg:#fbf0da;
    --danger:#a8433a; --danger-bg:#f8e2df;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--bg); color:var(--text); font-family:var(--font-body); line-height:1.5; -webkit-font-smoothing:antialiased; }
  .wrap{ max-width:860px; margin:0 auto; padding:28px 20px 80px; }
  header.top{ position:sticky; top:0; z-index:10; background:color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter:blur(8px); border-bottom:1px solid var(--border); padding:16px 20px; }
  header.top .inner{ max-width:860px; margin:0 auto; }
  .eyebrow{ font-family:var(--font-display); font-size:11px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); margin:0 0 4px; }
  h1{ font-family:var(--font-display); font-size:22px; font-weight:700; margin:0 0 10px; letter-spacing:-.01em; text-wrap:balance; }
  .progress-row{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .bar{ flex:1; min-width:120px; height:8px; border-radius:99px; background:var(--surface-2); overflow:hidden; border:1px solid var(--border); display:flex; }
  .bar-seg-ok{ height:100%; background:var(--ok); }
  .bar-seg-fail{ height:100%; background:var(--danger); }
  .count{ font-family:var(--font-mono); font-variant-numeric:tabular-nums; font-size:12.5px; color:var(--text-muted); white-space:nowrap; }
  .count b.ok{ color:var(--ok); } .count b.fail{ color:var(--danger); }
  .header-actions{ display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  button.pillbtn{ font-family:var(--font-body); font-size:12px; border-radius:6px; padding:4px 12px; cursor:pointer; border:1px solid var(--border); background:var(--surface-2); color:var(--text); }
  button.pillbtn.primary{ background:var(--accent); border-color:var(--accent); color:var(--bg); font-weight:600; }
  button.pillbtn:hover{ filter:brightness(1.08); }
  button:focus-visible, summary:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .intro{ font-size:13.5px; color:var(--text-muted); max-width:66ch; margin:16px 0 24px; padding:12px 14px; background:var(--surface); border:1px solid var(--border); border-radius:8px; }
  .intro code{ font-family:var(--font-mono); font-size:12px; background:var(--surface-2); padding:1px 5px; border-radius:4px; }
  .backlog{ background:var(--surface); border:1px solid var(--warn); border-radius:8px; padding:12px 14px; margin-bottom:20px; }
  .backlog summary{ padding:0; cursor:pointer; display:flex; align-items:center; gap:8px; list-style:none; }
  .backlog summary::-webkit-details-marker{ display:none; }
  .backlog-title{ font-family:var(--font-display); font-weight:700; font-size:13.5px; color:var(--warn); }
  .backlog-count{ font-family:var(--font-mono); font-size:11.5px; color:var(--text-muted); }
  .backlog ul{ list-style:none; margin:10px 0 0; padding:0; display:flex; flex-direction:column; gap:8px; }
  .backlog li{ font-size:12.5px; line-height:1.5; padding-left:14px; border-left:2px solid var(--border); }
  .backlog li b{ display:block; font-size:13px; color:var(--text); margin-bottom:2px; }
  .backlog li .why{ color:var(--text-muted); }
  .backlog li .status{ display:inline-block; font-family:var(--font-mono); font-size:10px; padding:1px 6px; border-radius:4px; margin-left:6px; vertical-align:1px; }
  .backlog li .status.blocked{ background:var(--danger-bg); color:var(--danger); }
  .backlog li .status.deferred{ background:var(--warn-bg); color:var(--warn); }
  .backlog li .status.rejected{ background:var(--surface-2); color:var(--text-muted); }
  details.section{ background:var(--surface); border:1px solid var(--border); border-radius:10px; margin-bottom:12px; overflow:hidden; }
  details.section[open] summary{ border-bottom:1px solid var(--border); }
  summary{ list-style:none; cursor:pointer; padding:14px 16px; display:flex; align-items:center; gap:10px; justify-content:space-between; }
  summary::-webkit-details-marker{ display:none; }
  .sec-title{ display:flex; align-items:baseline; gap:10px; min-width:0; flex-wrap:wrap; }
  .sec-name{ font-family:var(--font-display); font-weight:700; font-size:15px; white-space:nowrap; }
  .sec-ver{ font-family:var(--font-mono); font-size:11.5px; color:var(--text-muted); white-space:nowrap; }
  .sec-right{ display:flex; align-items:center; gap:8px; flex-shrink:0; }
  .chevron{ transition:transform .2s ease; color:var(--text-muted); font-size:12px; }
  details[open] .chevron{ transform:rotate(90deg); }
  .sec-count{ font-family:var(--font-mono); font-variant-numeric:tabular-nums; font-size:11.5px; color:var(--text-muted); }
  .sec-count.done{ color:var(--ok); }
  ul.items{ list-style:none; margin:0; padding:6px; }
  li.item{ display:flex; flex-direction:column; gap:8px; padding:10px; border-radius:6px; border-left:3px solid transparent; }
  li.item:hover{ background:var(--surface-2); }
  li.item.risk-alto{ border-left-color:var(--danger); }
  li.item.risk-medio{ border-left-color:var(--warn); }
  li.item.risk-bajo{ border-left-color:var(--ok); }
  .item-row{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .item-text{ min-width:0; }
  .item-claim{ font-size:14px; font-weight:600; }
  .item-detail{ font-size:12.5px; color:var(--text-muted); margin-top:2px; }
  .fixed-tag{ display:inline-block; font-family:var(--font-mono); font-size:10px; background:var(--ok-bg); color:var(--ok); padding:1px 6px; border-radius:4px; margin-left:6px; vertical-align:1px; }
  .clave-tag{ display:inline-block; font-family:var(--font-display); font-size:9.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; background:var(--accent-soft); color:var(--accent); padding:1px 6px; border-radius:4px; margin-right:6px; vertical-align:1px; }
  code.k{ font-family:var(--font-mono); font-size:11.5px; background:var(--surface-2); padding:1px 5px; border-radius:4px; overflow-wrap:anywhere; }
  .tristate{ display:flex; gap:4px; flex-shrink:0; }
  .tristate button{ font-family:var(--font-body); font-size:11px; font-weight:600; padding:4px 9px; border-radius:6px; border:1px solid var(--border); background:var(--surface-2); color:var(--text-muted); cursor:pointer; white-space:nowrap; }
  .tristate button[data-state="untested"].active{ background:var(--surface-2); color:var(--text); border-color:var(--text-muted); }
  .tristate button[data-state="failed"].active{ background:var(--danger-bg); color:var(--danger); border-color:var(--danger); }
  .tristate button[data-state="confirmed"].active{ background:var(--ok-bg); color:var(--ok); border-color:var(--ok); }
  .note-row{ margin-top:0; }
  .note-toggle{ font-family:var(--font-body); font-size:11.5px; color:var(--text-muted); background:none; border:none; padding:2px 0; cursor:pointer; display:inline-flex; align-items:center; gap:4px; }
  .note-toggle:hover{ color:var(--accent); }
  .note-toggle.has-note{ color:var(--accent); font-weight:600; }
  textarea.note-box{ display:none; width:100%; margin-top:6px; font-family:var(--font-body); font-size:13px; color:var(--text); background:var(--surface-2); border:1px solid var(--border); border-radius:6px; padding:8px; resize:vertical; min-height:44px; }
  textarea.note-box.open{ display:block; }
  .modal-backdrop{ position:fixed; inset:0; background:rgba(10,12,14,.55); display:none; align-items:center; justify-content:center; padding:20px; z-index:100; }
  .modal-backdrop.open{ display:flex; }
  .modal{ background:var(--surface); border:1px solid var(--border); border-radius:12px; max-width:640px; width:100%; max-height:82vh; display:flex; flex-direction:column; padding:18px; gap:10px; box-shadow:0 20px 60px rgba(0,0,0,.35); }
  .modal h2{ font-family:var(--font-display); font-size:16px; margin:0; }
  .modal .status{ font-size:12.5px; color:var(--text-muted); margin:0; }
  .modal .status.ok{ color:var(--ok); }
  textarea.report-box{ flex:1; min-height:280px; font-family:var(--font-mono); font-size:12px; color:var(--text); background:var(--surface-2); border:1px solid var(--border); border-radius:8px; padding:10px; resize:vertical; white-space:pre; overflow:auto; }
  .modal-actions{ display:flex; justify-content:flex-end; gap:8px; }
  footer{ text-align:center; font-size:12px; color:var(--text-muted); margin-top:28px; }
  @media (prefers-reduced-motion: reduce){ .chevron{ transition:none; } }
</style>

<header class="top">
  <div class="inner">
    <p class="eyebrow">SteamPad · Banco de pruebas de hardware</p>
    <h1 id="mainTitle">Checklist de validación</h1>
    <div class="progress-row">
      <div class="bar"><div class="bar-seg-ok" id="barOk"></div><div class="bar-seg-fail" id="barFail"></div></div>
      <span class="count" id="countLabel">0 / 0</span>
    </div>
    <div class="header-actions">
      <button class="pillbtn primary" id="exportBtn" type="button">Exportar reporte</button>
      <button class="pillbtn" id="resetBtn" type="button">Reiniciar estados</button>
    </div>
  </div>
</header>

<div class="wrap">
  <p class="intro" id="introText"></p>
  <div id="backlogBox"></div>
  <div id="sections"></div>
  <footer id="footerText"></footer>
</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <h2 id="modalTitle">Reporte de validación</h2>
    <p class="status" id="modalStatus">Selecciona el texto y cópialo (Ctrl+C) para pegarlo en el chat.</p>
    <textarea class="report-box" id="reportBox" readonly></textarea>
    <div class="modal-actions">
      <button class="pillbtn" id="modalCopyBtn" type="button">Copiar al portapapeles</button>
      <button class="pillbtn primary" id="modalCloseBtn" type="button">Cerrar</button>
    </div>
  </div>
</div>

<script>
/* ============================================================================================
 * ÚNICA FUENTE DE DATOS. Para actualizar el checklist: edita este array (agrega/quita/cambia
 * objetos), nunca el HTML/CSS de abajo. Cada objeto es una edición barata y aislada.
 *
 * Campos: id (estable, no cambiar entre rondas), section (agrupa y ordena), ver (dónde vive el
 * código vigente), risk ('bajo'|'medio'|'alto'), clave (bool, resalta como prueba crítica),
 * text (afirmación corta), detail (una línea de contexto), fixedIn (opcional, "v0.51.0" si se
 * tocó código esta ronda), default ('untested'|'failed'|'confirmed' — estado de partida).
 * ========================================================================================== */
const META = {
  title: "SteamPad — Checklist de validación (FASE 79, v0.61.0)",

    "abajo es de solo lectura — todo lo que NO está implementado todavía, para entrar en contexto en " +
    "10 segundos sin abrir TASKS.md. Las secciones de prueba totalmente confirmadas empiezan " +
    "colapsadas — lo que ves abierto es lo que falta probar. Marca cada punto al probarlo; usa " +
    "\"Exportar reporte\" y pégamelo en el chat cuando quieras que actualice la documentación del " +
    "proyecto con los resultados reales.",
  footer: "SteamPad · sincronizado con TASKS.md / TODO_BLOCKERS.md / DECISIONS.md · última ronda: 2026-07-17"
};

const ITEMS = [

  // ---- Sistema de Emotes ----

function setItemState(id, s){ state[id] = state[id] || {}; state[id].state = s; save(); }
function setItemNote(id, n){ state[id] = state[id] || {}; state[id].note = n; save(); }
function save(){ try { localStorage.setItem(STATE_KEY, JSON.stringify(state)); } catch(e) {} }

document.getElementById('mainTitle').textContent = META.title.replace('SteamPad — ', '');
document.getElementById('introText').innerHTML = META.intro;
document.getElementById('footerText').textContent = META.footer;

// ---- Backlog panel: read-only, collapsed by default (a "did you know X isn't built yet" reference,
// not something to check off) — opens automatically if it's ever emptied to zero, though it never
// will be in practice (there's always SOMETHING deferred/blocked in a project this size).
(function renderBacklog() {
  const box = document.getElementById('backlogBox');
  if (!BACKLOG.length) return;
  const statusLabel = {pending:'Pendiente', deferred:'Pospuesto', blocked:'Bloqueado'};
  const det = document.createElement('details');
  det.className = 'backlog';
  const summary = document.createElement('summary');
  summary.innerHTML = `<span class="backlog-title">🔧 Pendiente de implementar</span>` +
      `<span class="backlog-count">${BACKLOG.length} ${BACKLOG.length === 1 ? 'punto' : 'puntos'} — sin marcar aquí, se controlan en TASKS.md</span>`;
  det.appendChild(summary);
  const ul = document.createElement('ul');
  BACKLOG.forEach(b => {
    const li = document.createElement('li');
    li.innerHTML = `<b>${b.title}<span class="status ${b.status}">${statusLabel[b.status] || b.status}</span></b>` +
        `<span class="why">${b.why}</span>`;
    ul.appendChild(li);
  });
  det.appendChild(ul);
  box.appendChild(det);
})();

const bySection = new Map();
ITEMS.forEach(it => {
  if (!bySection.has(it.section)) bySection.set(it.section, []);
  bySection.get(it.section).push(it);
});

const sectionsEl = document.getElementById('sections');
for (const [name, items] of bySection) {
  const allConfirmed = items.every(it => getState(it.id, it.default) === 'confirmed');
  const det = document.createElement('details');
  det.className = 'section';
  det.open = !allConfirmed;
  const ver = items[0].ver;

  const summary = document.createElement('summary');
  summary.innerHTML = `
    <div class="sec-title">
      <span class="sec-name">${name}</span>
      <span class="sec-ver">${ver}</span>
    </div>
    <div class="sec-right">
      <span class="sec-count" data-sec="${name}"></span>
      <span class="chevron">▶</span>
    </div>`;
  det.appendChild(summary);

  const ul = document.createElement('ul');
  ul.className = 'items';
  items.forEach(it => ul.appendChild(renderItem(it)));
  det.appendChild(ul);

  sectionsEl.appendChild(det);
}

function renderItem(it) {
  const li = document.createElement('li');
  li.className = 'item risk-' + (it.risk || 'bajo');

  const claveTag = it.clave ? '<span class="clave-tag">Clave</span>' : '';
  const fixedTag = it.fixedIn ? `<span class="fixed-tag">corregido ${it.fixedIn}</span>` : '';

  const row = document.createElement('div');
  row.className = 'item-row';
  row.innerHTML = `
    <div class="item-text">
      <div class="item-claim">${claveTag}${it.text}${fixedTag}</div>
      <div class="item-detail">${it.detail}</div>
    </div>
    <div class="tristate" data-id="${it.id}">
      <button data-state="untested" title="No probado">No probado</button>
      <button data-state="failed" title="Falló / pendiente">Falló</button>
      <button data-state="confirmed" title="Confirmado funcionando">✓ OK</button>
    </div>`;
  li.appendChild(row);

  const tri = row.querySelector('.tristate');
  const current = getState(it.id, it.default);
  [...tri.children].forEach(btn => {
    btn.classList.toggle('active', btn.dataset.state === current);
    btn.addEventListener('click', () => {
      setItemState(it.id, btn.dataset.state);
      [...tri.children].forEach(b => b.classList.toggle('active', b === btn));
      updateAll();
    });
  });

  const noteRow = document.createElement('div');
  noteRow.className = 'note-row';
  const existingNote = getNote(it.id);
  const toggle = document.createElement('button');
  toggle.type = 'button';
  toggle.className = 'note-toggle' + (existingNote ? ' has-note' : '');
  toggle.textContent = existingNote ? '📝 Nota (con contenido)' : '📝 Agregar nota';
  const box = document.createElement('textarea');
  box.className = 'note-box' + (existingNote ? ' open' : '');
  box.placeholder = '¿Qué pasó exactamente?';
  box.value = existingNote;
  toggle.addEventListener('click', () => box.classList.toggle('open'));
  box.addEventListener('input', () => {
    setItemNote(it.id, box.value);
    const has = !!box.value.trim();
    toggle.classList.toggle('has-note', has);
    toggle.textContent = has ? '📝 Nota (con contenido)' : '📝 Agregar nota';
  });
  noteRow.appendChild(toggle);
  noteRow.appendChild(box);
  li.appendChild(noteRow);

  return li;
}

function updateAll() {
  let ok = 0, fail = 0, total = ITEMS.length;
  ITEMS.forEach(it => {
    const s = getState(it.id, it.default);
    if (s === 'confirmed') ok++; else if (s === 'failed') fail++;
  });
  document.getElementById('countLabel').innerHTML =
    `<b class="ok">${ok} OK</b> · <b class="fail">${fail} fallando</b> · ${total} total`;
  document.getElementById('barOk').style.width = (total ? ok/total*100 : 0) + '%';
  document.getElementById('barFail').style.width = (total ? fail/total*100 : 0) + '%';

  for (const [name, items] of bySection) {
    const c = items.filter(it => getState(it.id, it.default) === 'confirmed').length;
    const label = document.querySelector(`[data-sec="${CSS.escape(name)}"]`);
    if (label) {
      label.textContent = c + '/' + items.length;
      label.classList.toggle('done', c === items.length);
    }
  }
}
updateAll();

document.getElementById('resetBtn').addEventListener('click', () => {
  if (!confirm('Esto borra todos los estados y notas guardados en este navegador. ¿Continuar?')) return;
  state = {};
  save();
  location.reload();
});

// ---- Export ----
function claimPlain(it) {
  return (it.clave ? '[CLAVE] ' : '') + it.text;
}
function stateMark(s) { return s === 'confirmed' ? 'x' : (s === 'failed' ? '!' : ' '); }

function buildReport() {
  const now = new Date();
  let dateStr;
  try { dateStr = now.toLocaleString('es-ES', { dateStyle: 'medium', timeStyle: 'short' }); }
  catch(e) { dateStr = now.toString(); }

  let totalOk = 0, totalFail = 0, total = ITEMS.length;
  const lines = [];
  for (const [name, items] of bySection) {
    let secOk = 0;
    const secLines = [];
    items.forEach(it => {
      const s = getState(it.id, it.default);
      if (s === 'confirmed') { totalOk++; secOk++; }
      if (s === 'failed') totalFail++;
      secLines.push(`- [${stateMark(s)}] ${claimPlain(it)}`);
      const note = getNote(it.id).trim();
      if (note) note.split('\n').forEach(nl => secLines.push('      Nota: ' + nl));
    });
    lines.push(`## ${name} — ${items[0].ver} — ${secOk}/${items.length}`);
    lines.push(...secLines);
    lines.push('');
  }
  const header = [
    `# SteamPad — Reporte de validación (${dateStr})`,
    `Progreso: ${totalOk} OK / ${totalFail} fallando / ${total} total`,
    'Leyenda: [x] confirmado · [!] falló o pendiente (ver Nota) · [ ] no probado',
    ''
  ];
  return header.concat(lines).join('\n');
}

const modalBackdrop = document.getElementById('modalBackdrop');
const modalStatus = document.getElementById('modalStatus');
const reportBox = document.getElementById('reportBox');

function openModal() {
  const report = buildReport();
  reportBox.value = report;
  modalBackdrop.classList.add('open');
  modalStatus.textContent = 'Selecciona el texto y cópialo (Ctrl+C) para pegarlo en el chat.';
  modalStatus.classList.remove('ok');
  reportBox.focus();
  reportBox.select();
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(report).then(() => {
      modalStatus.textContent = '✅ Copiado al portapapeles — pégalo directo en el chat.';
      modalStatus.classList.add('ok');
    }).catch(() => {});
  }
}
function closeModal() { modalBackdrop.classList.remove('open'); }

document.getElementById('exportBtn').addEventListener('click', openModal);
document.getElementById('modalCloseBtn').addEventListener('click', closeModal);
document.getElementById('modalCopyBtn').addEventListener('click', () => {
  reportBox.focus();
  reportBox.select();
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(reportBox.value).then(() => {
      modalStatus.textContent = '✅ Copiado al portapapeles — pégalo directo en el chat.';
      modalStatus.classList.add('ok');
    }).catch(() => {
      modalStatus.textContent = 'No se pudo copiar automático — ya está seleccionado, usa Ctrl+C.';
      modalStatus.classList.remove('ok');
    });
  }
});
modalBackdrop.addEventListener('click', (e) => { if (e.target === modalBackdrop) closeModal(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && modalBackdrop.classList.contains('open')) closeModal(); });
</script>
