# Gradle
org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true
org.gradle.caching=true

# SteamPad — shared across every variant. Per-variant values (MC version, Fabric API, Parchment,
# manifest dependency ranges) live in versions/<variant>/gradle.properties.
modVersion=1.1.1
maven_group=dev.steampad
archives_base_name=steampad

# Loader/library versions that are the same on every currently supported variant.
deps.fabricLoader=0.16.14
deps.steamworks4j=1.9.0
