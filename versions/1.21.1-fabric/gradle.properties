modstitch.platform=fabric-loom-remap

mcVersion=1.21.1
packFormat=34

# No parchment.minecraft here on purpose: the artifact is parchment-1.21.1, so ModStitch's default
# (the variant's own MC version) is already correct.
parchment.version=2024.11.17

deps.fabricApi=0.104.0+1.21.1
deps.modMenu=11.0.2

# Goes into the generated manifest. Upper bound matters: 1.21.2 introduced entity render states,
# so a 1.21.1 jar must never load on 1.21.2+.
meta.mcDep=~1.21 <1.21.2
meta.fapiDep=>=0.100.0

pub.stableMC=1.21,1.21.1
